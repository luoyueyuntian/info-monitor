services:
  postgres:
    image: postgres:16-alpine
    container_name: info-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: info_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d info_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    image: info-monitor-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: info-monitor-api
    ports:
      - "6780:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/info_monitor
      API_PORT: 3001
      CORS_ORIGIN: "*"
      MEILI_HOST: http://meilisearch:7700
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped

  worker:
    image: info-monitor-worker:latest
    build:
      context: ./apps/python-worker
      dockerfile: Dockerfile
    container_name: info-monitor-worker
    stop_grace_period: 90s
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/info_monitor
      MEILI_HOST: http://meilisearch:7700
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-600}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_MAX_RUN_SECONDS: ${WORKER_MAX_RUN_SECONDS:-1800}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped

  maintenance:
    profiles: ["maintenance"]
    image: info-monitor-maintenance:latest
    build:
      context: ./apps/python-worker
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "info_monitor_worker.maintenance"]
    command: []
    user: "${ARCHIVE_UID:-1000}:${ARCHIVE_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/info_monitor
      INFO_MONITOR_ARCHIVE_ROOT: /archive
    volumes:
      - "${INFO_MONITOR_ARCHIVE_DIR:-./data/archive}:/archive"

  scheduler:
    image: info-monitor-scheduler:latest
    build:
      context: ./apps/python-scheduler
      dockerfile: Dockerfile
    container_name: info-monitor-scheduler
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/info_monitor
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: info-monitor-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

volumes:
  postgres_data:
  meilisearch_data:
